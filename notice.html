<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공지사항 | DESIGNBANK 디자인뱅크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&amp;family=Noto+Sans+KR:wght@300;400;500;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=202610121200">
<style>
  /* 모바일에서도 검색칸을 한 줄로 (제목 선택 + 검색어 입력) */
  @media (max-width:600px){
    .search{flex-direction:row;align-items:center;gap:8px;padding:14px}
    .search select{flex:none;width:88px;padding:0 8px;font-size:16px}
    .search input{flex:1;min-width:0;padding:0 12px;font-size:16px}
  }
</style>
</head>
<body data-page="notice" data-group="notice">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="tri" viewBox="0 0 24 47.5" preserveAspectRatio="none"><polygon points="12,0 24,47.5 0,47.5" fill="#fd0606"></polygon></symbol>
</svg>

<header class="header" id="header">
  <div class="header-inner">
    <a href="index.html" class="logo" aria-label="DESIGNBANK 홈">
      <b>DESIGN</b><span>B<span class="a">A<svg class="tri" aria-hidden="true"><use href="#tri"></use></svg></span>NK</span>
    </a>
    <button class="menu-btn" aria-label="메뉴 열기" aria-expanded="false" aria-controls="nav"><span></span><span></span><span></span></button>
    <nav class="nav" id="nav">
      <a href="index.html" data-nav="home">홈</a>
      <a href="about.html" data-nav="about">회사소개</a>
      <a href="portfolio.html" data-nav="portfolio">포트폴리오</a>
      <a href="notice.html" data-nav="notice">공지사항</a>
    </nav>
  </div>
</header>

<main>
  <section class="page">
    <p class="notice-title" data-view-title="40년 디자인경력 디자이너는 다릅니다">40년 디자인경력 디자이너가 직접 제작합니다</p>
    <form class="search" role="search" onsubmit="return false">
      <select aria-label="검색 항목"><option>제목</option></select>
      <input type="search" id="q" placeholder="검색어를 입력하세요" aria-label="검색어">
    </form>
    <table class="board">
      <thead><tr><th>제목</th><th class="date">날자</th></tr></thead>
      <tbody id="board-body"></tbody>
    </table>
    <div class="pager"><button type="button">Prev</button><b>1</b><button type="button">Next</button></div>
    <article class="detail" id="post" style="display:none"></article>
  </section>
</main>

<footer class="footer">
  <div class="footer-inner">
    <b>디자인뱅크</b>
    <address>
      강원특별자치도 원주시 강변로 525 (평원동)<br>
      E-mail. <a href="mailto:greencomm@hanmail.net">greencomm@hanmail.net</a><br>
      <span>Tel. <a href="tel:070-8621-9936">070-8621-9936</a></span> Mobile. <a href="tel:010-2224-9936">010-2224-9936</a>
    </address>
  </div>
</footer>

<script id="notice-data">
/* 공지사항 글 목록: admin.html(편집기)에서 고치면 이 부분이 바뀝니다 */
window.NOTICE_POSTS = [
  {id:1,title:"제19회 한반도미술대전 초대작가 출품원서",date:"2026.06.10",body:"공지 내용을 이곳에 입력하세요."}
];
</script>
<script src="js/common.js?v=202610121200"></script>
<script id="notice-render">
/* 공지사항 목록과 글 보기: 위 NOTICE_POSTS로 이 페이지가 직접 그립니다 (js/common.js 버전과 상관없이 동작) */
(function(){
  var P = window.NOTICE_POSTS || [];
  var body = document.getElementById("board-body"), post = document.getElementById("post"), q = document.getElementById("q");
  if (!body) return;
  if (q) { var nq = q.cloneNode(true); q.parentNode.replaceChild(nq, q); q = nq; }
  var id = Number(new URLSearchParams(location.search).get("id"));
  var back = '<a class="back" href="notice.html">목록으로</a>';
  function list(s) {
    var l = P.filter(function (p) { return p.title.indexOf(s) > -1; });
    body.innerHTML = l.length ? l.map(function (p) {
      return '<tr><td><a href="notice.html?id=' + p.id + '">' + p.title + '</a></td><td class="date">' + p.date + '</td></tr>';
    }).join("") : '<tr class="empty"><td colspan="2">검색 결과가 없습니다. 다른 검색어를 입력해 보세요.</td></tr>';
  }
  if (id && post) {
    document.querySelectorAll(".search,.board,.pager").forEach(function (e) { e.style.display = "none"; });
    var t = document.querySelector(".notice-title");
    if (t && t.getAttribute("data-view-title")) t.textContent = t.getAttribute("data-view-title");
    var p = P.filter(function (x) { return x.id === id; })[0];
    post.innerHTML = p ? '<h3>' + p.title + '</h3><time>' + p.date + '</time><hr><div class="body">' + p.body + '</div>' + back
                       : '<p>글을 찾을 수 없습니다. 목록에서 다시 선택해 주세요.</p>' + back;
    post.style.display = "";
  } else {
    if (post) post.style.display = "none";
    list("");
    if (q) q.addEventListener("input", function (e) { list(e.target.value.trim()); });
  }
})();
</script>
</body>
</html>
